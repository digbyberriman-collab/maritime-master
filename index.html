<!doctype html>
<html lang="en" class="dark" style="color-scheme: dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>STORM | Superyacht Technical Operations, Research & Management</title>
    <meta name="description" content="STORM - Superyacht Technical Operations, Research & Management platform for professional yacht management" />
    <meta name="author" content="STORM" />
    <meta name="application-name" content="STORM" />
    <meta name="apple-mobile-web-app-title" content="STORM" />
    <!-- Abyss is the default; the pre-paint script below switches to Daylight when chosen. -->
    <meta name="color-scheme" content="dark light" />
    <!-- Script-managed: the pre-paint script and theme-config.applyThemeColor set it
         from the user's choice. Browsers use the FIRST theme-color whose media
         matches, so it stays first; the per-scheme ones after it are fallbacks for
         readers that skip scripts (src/test/design/themeRuntime.test.tsx). -->
    <meta name="theme-color" content="#0A0E14" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#0A0E14" />
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#F5F7FA" />

    <!-- Installable app (gap/10 IA26). Icons: scripts/design/make-icons.mjs. No service worker (D-60). -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" href="/favicon.ico" sizes="32x32" />
    <link rel="icon" href="/icons/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />

    <meta property="og:title" content="STORM | Superyacht Technical Operations, Research & Management" />
    <meta property="og:description" content="Professional superyacht management platform for technical operations, research, and fleet management" />
    <meta property="og:type" content="website" />
    <meta property="og:image" content="/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="STORM — Maritime Master" />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:image" content="/og-image.png" />

    <!-- Pre-paint theme and density (no white flash). Mirrors
         src/components/ui/theme-config.ts; tested in src/test/design/themeRuntime.test.tsx. -->
    <script data-storm-prepaint>
      (function () {
        var d = document.documentElement;
        var theme = 'dark';
        var density = null;
        try {
          var stored = localStorage.getItem('storm-theme');
          if (stored === 'light' || stored === 'dark') theme = stored;
          else if (stored === 'system' && window.matchMedia) {
            theme = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
          }
          var sd = localStorage.getItem('storm-density');
          if (sd === 'comfortable' || sd === 'default' || sd === 'compact') density = sd;
        } catch (e) {}
        if (!density) {
          var coarse = !!(window.matchMedia && window.matchMedia('(pointer: coarse)').matches);
          density = coarse && window.innerWidth < 1024 ? 'comfortable' : 'default';
        }
        d.classList.remove('dark', 'light');
        d.classList.add(theme);
        d.style.colorScheme = theme;
        d.setAttribute('data-density', density);
        var meta = document.querySelector('meta[name="theme-color"]:not([media])');
        if (meta) meta.setAttribute('content', theme === 'light' ? '#F5F7FA' : '#0A0E14');
      })();
    </script>
    <!-- First-paint colours before the stylesheet arrives (Abyss / Daylight), and
         the boot, watchdog and recovery screens, which render without the app CSS. -->
    <style>
      html { background: #0A0E14; color: #EEF1F5; }
      html.light { background: #F5F7FA; color: #0E141D; }
      .storm-boot { box-sizing: border-box; min-height: 100vh; min-height: 100dvh; display: flex; align-items: center; justify-content: center; padding: 24px; text-align: center; font-family: Inter, ui-sans-serif, system-ui, sans-serif; }
      .storm-boot-inner { display: flex; flex-direction: column; align-items: center; max-width: 24rem; }
      .storm-boot-lockup { display: inline-flex; align-items: center; gap: 12px; text-align: left; }
      .storm-boot-tile { display: grid; place-items: center; width: 48px; height: 48px; border-radius: 13px; background: #0A0E14; color: #00AFE6; box-shadow: inset 0 0 0 1px rgba(0, 175, 230, 0.25), 0 0 0 1px rgba(0, 175, 230, 0.5), 0 0 16px rgba(0, 175, 230, 0.25); }
      .storm-boot-tile svg { width: 40px; height: 40px; }
      .storm-boot-words { display: flex; flex-direction: column; }
      .storm-boot-mark { font-family: "Barlow Semi Condensed", Inter, ui-sans-serif, system-ui, sans-serif; font-weight: 600; font-size: 1.75rem; line-height: 1; letter-spacing: 0.18em; color: #EEF1F5; }
      .storm-boot-product { margin-top: 6px; font-family: "Barlow Semi Condensed", Inter, ui-sans-serif, system-ui, sans-serif; font-weight: 600; font-size: 0.6875rem; line-height: 0.875rem; letter-spacing: 0.08em; text-transform: uppercase; color: #8A94A6; }
      .storm-boot-progress { position: relative; overflow: hidden; width: 160px; height: 2px; margin-top: 28px; border-radius: 2px; background: #1C2533; }
      .storm-boot-progress::after { content: ""; position: absolute; top: 0; bottom: 0; left: 0; width: 40%; border-radius: 2px; background: #00AFE6; animation: storm-boot-sweep 1.4s cubic-bezier(0.2, 0, 0, 1) infinite; }
      @keyframes storm-boot-sweep { from { transform: translateX(-100%); } to { transform: translateX(250%); } }
      .storm-boot-text { margin: 0.75rem 0 0; color: #8A94A6; font-size: 0.875rem; line-height: 1.25rem; }
      .storm-boot-message { margin-top: 1.5rem; }
      .storm-boot-detail { margin: 0.75rem 0 0; color: #8A94A6; font-size: 0.6875rem; overflow-wrap: anywhere; }
      .storm-boot-button { margin-top: 1.25rem; min-height: 44px; border: 0; border-radius: 0.5rem; padding: 0.625rem 1.5rem; background: #00AFE6; color: #0A0E14; font: inherit; font-size: 0.875rem; font-weight: 600; cursor: pointer; }
      .storm-boot-button:focus-visible { outline: 2px solid #00AFE6; outline-offset: 2px; }
      html.light .storm-boot-mark { color: #0E141D; }
      html.light .storm-boot-text, html.light .storm-boot-detail, html.light .storm-boot-product { color: #4D5869; }
      html.light .storm-boot-progress { background: #D6DCE4; }
      html.light .storm-boot-progress::after { background: #00648F; }
      html.light .storm-boot-button { background: #00648F; color: #FFFFFF; }
      html.light .storm-boot-button:focus-visible { outline-color: #0089B8; }
      @media (prefers-reduced-motion: reduce) {
        .storm-boot-progress::after { animation: none; left: 30%; }
      }
    </style>

    <!-- Fonts (DECISIONS D-DS3): Inter (UI), Barlow Semi Condensed (display), JetBrains Mono (references).
         Loaded without blocking first paint, so a slow link at sea never holds the screen blank. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Barlow+Semi+Condensed:wght@500;600&family=Inter:wght@400..700&family=JetBrains+Mono:wght@400;500&display=swap"
      media="print"
      onload="this.media='all'"
    />
    <noscript>
      <link
        rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Barlow+Semi+Condensed:wght@500;600&family=Inter:wght@400..700&family=JetBrains+Mono:wght@400;500&display=swap"
      />
    </noscript>
    <link rel="preload" as="image" href="/assets/inkfish-logo.png" />
  </head>

  <body>
    <div id="root">
      <div data-storm-placeholder class="storm-boot">
        <div class="storm-boot-inner">
          <!-- The STORM mark (src/modules/auth/components/brand/stormMark.ts). The
               watchdog below and main.tsx's recovery panel reuse this lockup. -->
          <div class="storm-boot-lockup" data-storm-boot-logo>
            <span class="storm-boot-tile" aria-hidden="true">
              <svg viewBox="0 0 48 48" focusable="false">
                <g fill="none" stroke="currentColor" stroke-width="3.6" stroke-linecap="round">
                  <path d="M24 18a6 6 0 0 1 6 6c0 8.5-6.5 13.5-15.5 13.5" />
                  <path d="M24 30a6 6 0 0 1-6-6c0-8.5 6.5-13.5 15.5-13.5" />
                </g>
                <circle cx="24" cy="24" r="2.2" fill="currentColor" />
              </svg>
            </span>
            <span class="storm-boot-words">
              <span class="storm-boot-mark">STORM</span>
              <span class="storm-boot-product">Maritime Master</span>
            </span>
          </div>
          <div class="storm-boot-progress" aria-hidden="true"></div>
          <p class="storm-boot-text" role="status">Loading…</p>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      // Watchdog: if the app never takes over the placeholder (fatal startup
      // error, blocked assets), show an actionable message instead of an
      // endless "Loading…" screen. Colours come from the .storm-boot classes.
      (function () {
        var shown = false;
        function esc(s) {
          return String(s).replace(/[&<>"']/g, function (c) {
            return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
          });
        }
        function fail(detail) {
          if (shown) return;
          var root = document.getElementById('root');
          if (!root || !root.querySelector('[data-storm-placeholder]')) return;
          shown = true;
          var logo = root.querySelector('[data-storm-boot-logo]');
          root.innerHTML =
            '<div class="storm-boot" data-storm-watchdog><div class="storm-boot-inner">' +
            (logo ? logo.outerHTML : '<div class="storm-boot-mark">STORM</div>') +
            '<p class="storm-boot-text storm-boot-message" role="alert">STORM could not finish loading. This is usually a temporary connection problem.</p>' +
            '<button type="button" class="storm-boot-button" onclick="location.reload()">Reload</button>' +
            (detail ? '<p class="storm-boot-detail">' + esc(detail) + '</p>' : '') +
            '</div></div>';
        }
        window.addEventListener('error', function (e) {
          if (e && e.message) fail(String(e.message).slice(0, 160));
        });
        setTimeout(function () { fail(''); }, 12000);
      })();
    </script>
  </body>
</html>
