# verify_jwt policy (Phase 2 spec §C.2; proposed D-129). Every function has an
# explicit entry so the policy is visible in review.
#
#   verify_jwt = true   called by signed-in users (or, for send-email, by other
#                       functions with the service-role key). The gateway
#                       rejects requests without a valid JWT. It is a second
#                       layer only, so every function still checks its caller
#                       in code (`_shared/auth.ts` getAuthContext, or its own
#                       check): a legacy anon key is itself a valid JWT and
#                       passes the gateway. (A new `sb_publishable_` key is not
#                       a JWT; the gateway check is about the user's session
#                       token, which functions.invoke sends.)
#   verify_jwt = false  only for public token flows, webhooks and machine
#                       callers that authenticate themselves in code (API key,
#                       webhook secret, system key, cron secret).
#
# verify_jwt = true assumes the project still signs user tokens with the
# legacy HS256 JWT secret (D-129): the gateway check does not accept tokens
# signed with the newer asymmetric (ECC / RSA) signing keys and would answer
# 401 before the function runs. Before redeploying with these flags, or before
# rotating to asymmetric signing keys, check Project Settings > JWT Keys and
# follow the owner checklist. `scripts/edge/check.mjs` warns about every
# verify_jwt = true function with no in-code caller check that it can see
# (getAuthContext / getUser / getClaims / a service-role bearer compare): for
# those the gateway flag is the only check, so it must not be turned off
# before one is added.
#
# A new function called by signed-in users needs verify_jwt = true here too,
# and its own in-code caller check.

# Public token flow before sign-in: token lookup, per-IP and per-token rate
# limits, constant-time token compare (legacy: nothing issues tokens today).
[functions.accept-invitation]
verify_jwt = false

# Signed-in admins: getAuthContext + assertCapability('admin.access.users_access.admin').
[functions.admin-actions]
verify_jwt = true

# Signed-in users. No in-code auth yet (paid AI API): followup to add getAuthContext.
[functions.ai-route-planner]
verify_jwt = true

# Signed-in admins; checks its own user in code.
[functions.airtable-sync]
verify_jwt = true

# Cron with x-system-key (not a JWT) as well as users; the system key is checked in code.
[functions.ais-refresh]
verify_jwt = false

# Signed-in admins / masters: getAuthContext + assertCapability('admin.access.users_access.assign').
[functions.bulk-invite]
verify_jwt = true

# Signed-in users; own getUser check in code.
[functions.complete-drill]
verify_jwt = true

# Signed-in admins (user-called; verifies in code): getAuthContext +
