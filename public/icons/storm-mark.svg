<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="512" height="512">
  <title>STORM</title>
  <!-- STORM mark (original artwork): Signal on Abyss, full bleed. The glyph
       is drawn at 84 %, so its furthest point sits 15.4 of 24 units from the
       centre, well inside the maskable safe zone (19.2): one drawing serves
       the manifest's "any" and "maskable" icons. Paths match
       src/modules/auth/components/brand/stormMark.ts. -->
  <defs>
    <radialGradient id="storm-glow" cx="24" cy="24" r="20" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#00AFE6" stop-opacity="0.2"/>
      <stop offset="1" stop-color="#00AFE6" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="48" height="48" fill="#0A0E14"/>
  <circle cx="24" cy="24" r="20" fill="url(#storm-glow)"/>
  <g transform="translate(24 24) scale(0.84) translate(-24 -24)">
    <g fill="none" stroke="#00AFE6" stroke-width="3.6" stroke-linecap="round">
      <path d="M24 18a6 6 0 0 1 6 6c0 8.5-6.5 13.5-15.5 13.5"/>
      <path d="M24 30a6 6 0 0 1-6-6c0-8.5 6.5-13.5 15.5-13.5"/>
    </g>
    <circle cx="24" cy="24" r="2.2" fill="#00AFE6"/>
  </g>
</svg>
